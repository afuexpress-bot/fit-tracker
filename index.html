<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="減脂記錄">
<meta name="theme-color" content="#0D0D0D">
<title>減脂每日記錄</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root {
    --bg: #0D0D0D;
    --card: #1A1A1A;
    --card2: #222;
    --border: #2a2a2a;
    --text: #ffffff;
    --text2: #aaaaaa;
    --text3: #666666;
    --accent: #E8FF47;
    --green: #4DFFA0;
    --blue: #60C3FF;
    --red: #FF6B6B;
    --orange: #FF9F4A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, 'PingFang TC', 'Noto Sans TC', sans-serif; min-height: 100vh; padding-bottom: 80px; }

  /* Header */
  .header { background: var(--card); border-bottom: 1px solid var(--border); padding: 16px 16px 12px; position: sticky; top: 0; z-index: 100; }
  .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .app-title { font-size: 18px; font-weight: 800; }
  .app-title span { color: var(--accent); }
  .settings-btn { background: transparent; border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; color: var(--text2); font-size: 13px; cursor: pointer; }

  /* Date Nav */
  .date-nav { display: flex; align-items: center; justify-content: space-between; }
  .date-arrow { background: var(--card2); border: 1px solid var(--border); border-radius: 8px; width: 36px; height: 36px; color: var(--text2); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .date-arrow:active { background: #333; }
  .date-label { font-size: 15px; font-weight: 700; }

  /* Tabs */
  .tabs { display: flex; background: var(--card2); border-radius: 12px; padding: 4px; margin: 12px 16px; }
  .tab { flex: 1; padding: 9px 0; border-radius: 9px; border: none; background: transparent; color: var(--text3); font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: inherit; }
  .tab.active { background: var(--accent); color: #000; }

  /* Content */
  .content { padding: 0 16px; }

  /* Cards */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
  .card-title { font-size: 12px; font-weight: 700; color: var(--text3); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }

  /* Weight */
  .weight-row { display: flex; align-items: center; gap: 10px; }
  .weight-input { background: var(--card2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font-size: 22px; font-weight: 700; color: var(--text); width: 110px; text-align: right; font-family: inherit; }
  .weight-input:focus { outline: none; border-color: var(--accent); }
  .weight-diff { font-size: 13px; font-weight: 600; }

  /* Meal */
  .meal-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .meal-item:last-child { border-bottom: none; }
  .meal-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .meal-name { font-size: 14px; font-weight: 700; }
  .meal-time { font-size: 11px; color: var(--text3); }
  .meal-textarea { width: 100%; background: var(--card2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 13px; color: var(--text); resize: none; font-family: inherit; line-height: 1.5; }
  .meal-textarea:focus { outline: none; border-color: var(--accent); }
  .meal-result { display: flex; justify-content: space-between; align-items: center; margin-top: 7px; min-height: 26px; }
  .meal-kcal { font-size: 14px; font-weight: 700; color: var(--accent); }
  .meal-protein { font-size: 12px; color: var(--text2); }
  .meal-breakdown { font-size: 11px; color: var(--text3); margin-top: 4px; line-height: 1.5; }
  .analyzing { font-size: 12px; color: var(--text3); display: flex; align-items: center; gap: 6px; }
  .spinner { width: 12px; height: 12px; border: 2px solid var(--border); border-top-color: var(--text3); border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Water */
  .water-grid { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .water-drop { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--border); background: var(--card2); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; transition: all 0.15s; }
  .water-drop.filled { background: rgba(96,195,255,0.15); border-color: var(--blue); }
  .water-drop:active { transform: scale(0.9); }
  .water-label { font-size: 13px; color: var(--text2); }
  .water-label strong { color: var(--blue); }

  /* Exercise */
  .ex-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .ex-item:last-child { border-bottom: none; }
  .ex-check { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--border); background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.15s; font-size: 14px; }
  .ex-check.done { background: var(--green); border-color: var(--green); }
  .ex-icon { font-size: 22px; }
  .ex-text { flex: 1; }
  .ex-name { font-size: 14px; font-weight: 600; }
  .ex-sub { font-size: 12px; color: var(--text3); margin-top: 2px; }
  .ex-section { font-size: 11px; font-weight: 700; color: var(--text3); letter-spacing: 1px; text-transform: uppercase; padding: 10px 0 6px; }

  /* Summary */
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .stat-box { background: var(--card2); border-radius: 10px; padding: 12px; text-align: center; border: 1px solid var(--border); }
  .stat-val { font-size: 24px; font-weight: 800; }
  .stat-lbl { font-size: 11px; color: var(--text3); margin-top: 3px; }
  .progress-wrap { margin-bottom: 16px; }
  .progress-top { display: flex; justify-content: space-between; font-size: 12px; color: var(--text2); margin-bottom: 5px; }
  .progress-bg { background: var(--card2); border-radius: 99px; height: 10px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 99px; transition: width 0.4s; }
  .status-badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; }
  .badge-ok { background: rgba(77,255,160,0.15); color: var(--green); border: 1px solid rgba(77,255,160,0.3); }
  .badge-warn { background: rgba(255,159,74,0.15); color: var(--orange); border: 1px solid rgba(255,159,74,0.3); }
  .badge-over { background: rgba(255,107,107,0.15); color: var(--red); border: 1px solid rgba(255,107,107,0.3); }

  /* Chart */
  .chart-wrap { position: relative; height: 160px; margin-top: 8px; }

  /* Send btn */
  .send-btn { width: 100%; padding: 14px; background: var(--accent); color: #000; border: none; border-radius: 12px; font-size: 15px; font-weight: 800; cursor: pointer; margin-top: 6px; font-family: inherit; }
  .send-btn:active { opacity: 0.8; }

  /* Settings Panel */
  .settings-panel { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 200; align-items: flex-end; }
  .settings-panel.open { display: flex; }
  .settings-sheet { background: var(--card); border-radius: 20px 20px 0 0; padding: 20px 16px 40px; width: 100%; }
  .settings-title { font-size: 16px; font-weight: 800; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
  .settings-close { background: var(--card2); border: none; color: var(--text); border-radius: 50%; width: 30px; height: 30px; font-size: 16px; cursor: pointer; }
  .settings-label { font-size: 12px; color: var(--text3); margin-bottom: 6px; font-weight: 600; letter-spacing: 1px; }
  .settings-input { width: 100%; background: var(--card2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 14px; color: var(--text); font-family: inherit; margin-bottom: 12px; }
  .settings-input:focus { outline: none; border-color: var(--accent); }
  .settings-save { width: 100%; padding: 12px; background: var(--accent); color: #000; border: none; border-radius: 10px; font-size: 15px; font-weight: 800; cursor: pointer; font-family: inherit; }
  .api-hint { font-size: 11px; color: var(--text3); margin-bottom: 16px; line-height: 1.6; }
  .api-hint a { color: var(--blue); }

  /* Toast */
  .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 20px; font-size: 13px; font-weight: 600; z-index: 300; opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; }

  /* Note textarea */
  .note-textarea { width: 100%; background: var(--card2); border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-size: 13px; color: var(--text); resize: none; font-family: inherit; line-height: 1.5; min-height: 80px; }
  .note-textarea:focus { outline: none; border-color: var(--accent); }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-top">
    <div class="app-title">減脂 <span>記錄</span></div>
    <button class="settings-btn" onclick="openSettings()">⚙ API 設定</button>
  </div>
  <div class="date-nav">
    <button class="date-arrow" onclick="changeDate(-1)">‹</button>
    <div>
      <div class="date-label" id="dateLabel">今天</div>
      <div style="font-size:11px;color:var(--text3);text-align:center;margin-top:2px;" id="dateSubLabel"></div>
    </div>
    <button class="date-arrow" onclick="changeDate(1)">›</button>
  </div>
</div>

<!-- Tabs -->
<div class="tabs">
  <button class="tab active" id="tab-food" onclick="switchTab('food')">🥗 飲食</button>
  <button class="tab" id="tab-exercise" onclick="switchTab('exercise')">🏃 運動</button>
  <button class="tab" id="tab-summary" onclick="switchTab('summary')">📊 總結</button>
</div>

<!-- Food Panel -->
<div class="content" id="panel-food">

  <!-- Weight -->
  <div class="card">
    <div class="card-title">⚖ 今日體重</div>
    <div class="weight-row">
      <input type="number" step="0.1" id="weight" class="weight-input" placeholder="67.8" oninput="saveWeight()">
      <span style="font-size:14px;color:var(--text2)">kg</span>
      <span id="weight-diff" class="weight-diff"></span>
    </div>
  </div>

  <!-- Meals -->
  <div class="card">
    <div class="card-title">🍽 飲食記錄 <span style="font-weight:400;font-size:10px;color:var(--text3);letter-spacing:0">輸入後 AI 自動計算熱量</span></div>
    <div id="meals-list"></div>
  </div>

  <!-- Water -->
  <div class="card">
    <div class="card-title">💧 飲水量</div>
    <div class="water-grid" id="water-grid"></div>
    <div class="water-label">已喝 <strong id="water-ml">0</strong> ml
      <span id="water-badge" style="margin-left:8px;"></span>
    </div>
  </div>

</div>

<!-- Exercise Panel -->
<div class="content" id="panel-exercise" style="display:none;">
  <div class="card">
    <div class="card-title">🐕 遛狗</div>
    <div id="dogwalk-list"></div>
  </div>
  <div class="card">
    <div class="card-title">🔥 運動</div>
    <div id="workout-list"></div>
  </div>
  <div class="card">
    <div class="card-title">📝 備註</div>
    <textarea class="note-textarea" id="ex-note" placeholder="今天跳繩感覺、重訓部位、身體狀況..." oninput="saveNote()"></textarea>
  </div>
</div>

<!-- Summary Panel -->
<div class="content" id="panel-summary" style="display:none;">
  <div class="stats-grid">
    <div class="stat-box">
      <div class="stat-val" id="sum-kcal" style="color:var(--accent)">—</div>
      <div class="stat-lbl">總熱量 kcal</div>
    </div>
    <div class="stat-box">
      <div class="stat-val" id="sum-protein" style="color:var(--green)">—</div>
      <div class="stat-lbl">蛋白質</div>
    </div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <span style="font-size:13px;color:var(--text2)">熱量進度</span>
      <span id="kcal-badge"></span>
    </div>
    <div class="progress-bg"><div class="progress-fill" id="kcal-bar" style="background:var(--green);width:0%"></div></div>
    <div style="display:flex;justify-content:space-between;margin-top:4px;">
      <span style="font-size:10px;color:var(--text3)">0</span>
      <span style="font-size:10px;color:var(--text3)">目標 1400-1500 kcal</span>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:center;margin:14px 0 6px;">
      <span style="font-size:13px;color:var(--text2)">飲水</span>
      <span style="font-size:13px;color:var(--blue);font-weight:700;" id="water-sum"></span>
    </div>
    <div class="progress-bg"><div class="progress-fill" id="water-bar" style="background:var(--blue);width:0%"></div></div>
  </div>

  <div class="card">
    <div class="card-title">📈 體重趨勢（7天）</div>
    <div class="chart-wrap"><canvas id="weightChart" role="img" aria-label="7天體重折線圖"></canvas></div>
  </div>

  <!-- Daily Log -->
  <div class="card" id="daily-log-card">
    <div class="card-title">📋 今日完整記錄</div>
    <div id="daily-log" style="font-size:13px;color:var(--text2);line-height:2;"></div>
  </div>
</div>

<!-- Settings Panel -->
<div class="settings-panel" id="settings-panel" onclick="closeSettingsOutside(event)">
  <div class="settings-sheet">
    <div class="settings-title">
      ⚙ API 設定
      <button class="settings-close" onclick="closeSettings()">✕</button>
    </div>
    <div class="settings-label">ANTHROPIC API KEY</div>
    <div class="api-hint">
      到 <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a> 取得 API Key。<br>
      Key 儲存在手機本地，不會上傳到任何伺服器。<br>
      ⚠ 個人使用請勿分享此頁面給他人。
    </div>
    <input type="password" class="settings-input" id="api-key-input" placeholder="sk-ant-...">
    <button class="settings-save" onclick="saveApiKey()">儲存 API Key</button>
    <button onclick="testApi()" style="width:100%;padding:10px;background:transparent;border:1px solid var(--border);color:var(--text2);border-radius:10px;font-size:13px;cursor:pointer;font-family:inherit;margin-top:8px;">🧪 測試 API 連線</button>
    <div id="api-test-result" style="font-size:12px;margin-top:8px;text-align:center;"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ─── Data ───────────────────────────────────────────────
const MEALS = [
  { id:'breakfast', name:'早餐', time:'07:00', ph:'高蛋白奶昔 4匙 + 豆漿 100cc + 香蕉半根...' },
  { id:'lunch',     name:'午餐', time:'12:00', ph:'糙米飯 150g、雞胸肉 150g、花椰菜...' },
  { id:'snack',     name:'點心', time:'15:30', ph:'無糖豆漿 250ml、堅果一小把...' },
  { id:'dinner',    name:'晚餐', time:'18:30', ph:'豆腐 150g、菠菜、拾穀飯半碗...' },
  { id:'supper',    name:'宵夜', time:'21:00', ph:'希臘優格 100g、水果...' },
];
const DOGWALKS = [
  { id:'dw1', name:'第一次遛狗', sub:'20 分鐘', icon:'🐕' },
  { id:'dw2', name:'第二次遛狗', sub:'20 分鐘', icon:'🐕' },
  { id:'dw3', name:'第三次遛狗', sub:'20 分鐘', icon:'🐕' },
];
const WORKOUTS = [
  { id:'jumprope', name:'跳繩',  sub:'15 分鐘 HIIT',  icon:'🪢' },
  { id:'yoga',     name:'瑜伽',  sub:'自訂時間',       icon:'🧘' },
  { id:'strength', name:'重訓',  sub:'自訂時間',       icon:'💪' },
];

let currentDate = new Date(); currentDate.setHours(0,0,0,0);
let debounceTimers = {};
let analyzingSet = new Set();

// ─── Storage ─────────────────────────────────────────────
function dateKey(d) { return d.toISOString().slice(0,10); }
function loadAll() { try { return JSON.parse(localStorage.getItem('fitdata')||'{}'); } catch(e) { return {}; } }
function saveAll(data) { localStorage.setItem('fitdata', JSON.stringify(data)); }
function getDay(d) {
  const all = loadAll(); const k = dateKey(d);
  if (!all[k]) all[k] = { weight:'', meals:{}, kcals:{}, proteins:{}, breakdowns:{}, water:0, exercises:{}, note:'' };
  return all[k];
}
function setDay(d, data) { const all=loadAll(); all[dateKey(d)]=data; saveAll(all); }
function getApiKey() { return localStorage.getItem('anthropic_key')||''; }

// ─── API ──────────────────────────────────────────────────
async function analyzeKcal(mealId, text) {
  const apiKey = getApiKey();
  const d = getDay(currentDate);
  if (!text.trim() || text.trim()==='無') {
    d.kcals[mealId]=0; d.proteins[mealId]=0; d.breakdowns[mealId]='';
    setDay(currentDate, d); renderKcal(mealId); updateSummary(); return;
  }
  if (!apiKey) {
    showToast('⚙ 請先設定 API Key');
    const resEl=document.getElementById('res-'+mealId);
    if(resEl) resEl.innerHTML=`<span style="font-size:12px;color:var(--red)">⚠ 未設定 API Key</span>`;
    return;
  }
  analyzingSet.add(mealId); renderKcal(mealId);
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key': apiKey,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body: JSON.stringify({
        model:'claude-haiku-4-5-20251001',
        max_tokens:300,
        system:`你是營養師。根據食物描述估算熱量和蛋白質。只回傳JSON，格式：{"kcal":數字,"protein":數字,"breakdown":"簡述"}。數字為整數。不加markdown或其他文字。`,
        messages:[{role:'user',content:`食物：${text}`}]
      })
    });
    if(!res.ok) {
      const err = await res.json();
      throw new Error(err?.error?.message || `HTTP ${res.status}`);
    }
    const data = await res.json();
    const raw = data.content?.[0]?.text||'{}';
    const parsed = JSON.parse(raw.replace(/```json|```/g,'').trim());
    d.kcals[mealId]=parsed.kcal||0; d.proteins[mealId]=parsed.protein||0; d.breakdowns[mealId]=parsed.breakdown||'';
    setDay(currentDate, d);
  } catch(e) {
    console.error('API Error:', e);
    const resEl=document.getElementById('res-'+mealId);
    if(resEl) resEl.innerHTML=`<span style="font-size:11px;color:var(--red)">⚠ ${e.message} <button onclick="analyzeKcal('${mealId}',document.getElementById('mt-${mealId}').value)" style="background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:4px;padding:2px 6px;cursor:pointer;font-size:11px;margin-left:4px;">重試</button></span>`;
    analyzingSet.delete(mealId); return;
  }
  analyzingSet.delete(mealId); renderKcal(mealId); updateSummary();
}

// ─── Render ───────────────────────────────────────────────
function renderKcal(mealId) {
  const d = getDay(currentDate);
  const resEl = document.getElementById('res-'+mealId);
  const bdEl  = document.getElementById('bd-'+mealId);
  if (!resEl) return;
  if (analyzingSet.has(mealId)) {
    resEl.innerHTML = `<span class="analyzing"><span class="spinner"></span> AI 計算中...</span>`;
    if (bdEl) bdEl.textContent=''; return;
  }
  const kcal = d.kcals[mealId]||0, prot = d.proteins[mealId]||0;
  if (kcal > 0) {
    resEl.innerHTML = `<span class="meal-kcal">${kcal} kcal</span><span class="meal-protein">蛋白質 ${prot}g</span>`;
    if (bdEl) bdEl.textContent = d.breakdowns[mealId]||'';
  } else {
    resEl.innerHTML = `<span style="font-size:12px;color:var(--text3)">輸入食物後自動計算</span>`;
    if (bdEl) bdEl.textContent='';
  }
}
function renderKcalManual(mealId) {
  const resEl = document.getElementById('res-'+mealId);
  if (resEl) resEl.innerHTML = `<span style="font-size:12px;color:var(--text3)">需設定 API Key</span>`;
}

function renderMeals() {
  const d = getDay(currentDate);
  const list = document.getElementById('meals-list');
  list.innerHTML='';
  MEALS.forEach(m => {
    const div = document.createElement('div');
    div.className='meal-item';
    div.innerHTML=`
      <div class="meal-top">
        <span class="meal-name">${m.name}</span>
        <span class="meal-time">${m.time}</span>
      </div>
      <textarea class="meal-textarea" id="mt-${m.id}" rows="2" placeholder="${m.ph}" oninput="onMealInput('${m.id}')">${d.meals[m.id]||''}</textarea>
      <div style="display:flex;align-items:center;gap:8px;margin-top:7px;">
        <div class="meal-result" id="res-${m.id}" style="flex:1;margin-top:0;">
          <span style="font-size:12px;color:var(--text3)">輸入食物後自動計算</span>
        </div>
        <button onclick="manualCalc('${m.id}')" style="background:var(--card2);border:1px solid var(--border);color:var(--text2);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:12px;white-space:nowrap;flex-shrink:0;">🔄 計算</button>
      </div>
      <div class="meal-breakdown" id="bd-${m.id}"></div>
    `;
    list.appendChild(div);
    renderKcal(m.id);
  });
}

function manualCalc(mealId) {
  const val = document.getElementById('mt-'+mealId)?.value||'';
  if(!val.trim()) { showToast('請先輸入食物內容'); return; }
  analyzeKcal(mealId, val);
}

function onMealInput(mealId) {
  const val = document.getElementById('mt-'+mealId)?.value||'';
  const d = getDay(currentDate);
  d.meals[mealId]=val; setDay(currentDate,d);
  if (debounceTimers[mealId]) clearTimeout(debounceTimers[mealId]);
  debounceTimers[mealId] = setTimeout(() => analyzeKcal(mealId, val), 1200);
}

function renderExGroup(items, containerId) {
  const d = getDay(currentDate);
  const list = document.getElementById(containerId);
  if (!list) return;
  list.innerHTML='';
  items.forEach(e => {
    const done = d.exercises[e.id]||false;
    const row = document.createElement('div');
    row.className='ex-item';
    row.innerHTML=`
      <button class="ex-check ${done?'done':''}" onclick="toggleEx('${e.id}')">
        ${done?'✓':''}
      </button>
      <div class="ex-icon">${e.icon}</div>
      <div class="ex-text">
        <div class="ex-name" style="${done?'text-decoration:line-through;color:var(--text3)':''}">${e.name}</div>
        <div class="ex-sub">${e.sub}</div>
      </div>
    `;
    list.appendChild(row);
  });
}

function toggleEx(id) {
  const d = getDay(currentDate);
  d.exercises[id] = !d.exercises[id];
  setDay(currentDate, d);
  renderExGroup(DOGWALKS,'dogwalk-list');
  renderExGroup(WORKOUTS,'workout-list');
}

function renderWater() {
  const d = getDay(currentDate);
  const grid = document.getElementById('water-grid');
  if (!grid) return;
  grid.innerHTML='';
  let total=0;
  for (let i=0;i<8;i++) {
    const filled = i<(d.water||0);
    if (filled) total+=250;
    const btn = document.createElement('button');
    btn.className='water-drop'+(filled?' filled':'');
    btn.setAttribute('aria-label',`飲水 ${(i+1)*250}ml`);
    btn.textContent='💧';
    const idx=i;
    btn.onclick=()=>{ d.water=(idx<d.water)?idx:idx+1; setDay(currentDate,d); renderWater(); updateSummary(); };
    grid.appendChild(btn);
  }
  document.getElementById('water-ml').textContent=total;
  const wb=document.getElementById('water-badge');
  if (wb) wb.innerHTML=total>=2000?'<span class="status-badge badge-ok">達標</span>':'<span class="status-badge badge-warn">繼續補水</span>';
}

function updateSummary() {
  const d=getDay(currentDate);
  let totalKcal=0,totalProt=0;
  MEALS.forEach(m=>{totalKcal+=d.kcals[m.id]||0; totalProt+=d.proteins[m.id]||0;});

  const kcalEl=document.getElementById('sum-kcal');
  const protEl=document.getElementById('sum-protein');
  if(kcalEl) kcalEl.textContent=totalKcal>0?Math.round(totalKcal):'—';
  if(protEl) protEl.textContent=totalProt>0?Math.round(totalProt)+'g':'—';

  const bar=document.getElementById('kcal-bar');
  if(bar){
    bar.style.width=Math.min((totalKcal/1450)*100,110)+'%';
    bar.style.background=totalKcal<1200?'var(--orange)':totalKcal<=1550?'var(--green)':'var(--red)';
  }
  const badge=document.getElementById('kcal-badge');
  if(badge&&totalKcal>0){
    if(totalKcal<1200) badge.innerHTML='<span class="status-badge badge-warn">偏低</span>';
    else if(totalKcal<=1550) badge.innerHTML='<span class="status-badge badge-ok">達標 ✓</span>';
    else badge.innerHTML='<span class="status-badge badge-over">超標</span>';
  }
  const waterMl=(d.water||0)*250;
  const wBar=document.getElementById('water-bar');
  if(wBar) wBar.style.width=Math.min((waterMl/2000)*100,100)+'%';
  const wSum=document.getElementById('water-sum');
  if(wSum) wSum.textContent=waterMl+' / 2000 ml';

  renderDailyLog(d, totalKcal, totalProt);
  renderWeightChart();
}

function renderDailyLog(d, totalKcal, totalProt) {
  const el = document.getElementById('daily-log');
  if(!el) return;
  let html='';
  if(d.weight) html+=`<div>⚖ 體重：<strong style="color:var(--accent)">${d.weight} kg</strong></div>`;
  MEALS.forEach(m=>{
    if(d.meals[m.id]){
      html+=`<div>${m.name === '早餐'?'🌅':m.name==='午餐'?'☀️':m.name==='點心'?'🍎':m.name==='晚餐'?'🌙':'🥛'} ${m.name}：${d.meals[m.id]}`;
      if(d.kcals[m.id]) html+=` <span style="color:var(--accent);font-size:12px">${d.kcals[m.id]}kcal</span>`;
      html+='</div>';
    }
  });
  if(totalKcal>0) html+=`<div style="margin-top:6px;padding-top:6px;border-top:1px solid var(--border);">🔥 總熱量：<strong style="color:var(--accent)">${Math.round(totalKcal)} kcal</strong> ／ 蛋白質 <strong style="color:var(--green)">${Math.round(totalProt)}g</strong></div>`;
  const doneEx=[...DOGWALKS,...WORKOUTS].filter(e=>d.exercises[e.id]);
  if(doneEx.length) html+=`<div>💪 運動：${doneEx.map(e=>e.icon+e.name).join('、')}</div>`;
  el.innerHTML = html||'<span style="color:var(--text3)">今天還沒有記錄</span>';
}

let chartInst=null;
function renderWeightChart() {
  const labels=[],weights=[];
  const all=loadAll();
  for(let i=6;i>=0;i--){
    const d2=new Date(currentDate); d2.setDate(d2.getDate()-i);
    labels.push(['日','一','二','三','四','五','六'][d2.getDay()]);
    const w=all[dateKey(d2)]?.weight;
    weights.push(w?parseFloat(w):null);
  }
  const ctx=document.getElementById('weightChart');
  if(!ctx) return;
  if(chartInst) chartInst.destroy();
  const valid=weights.filter(Boolean);
  chartInst=new Chart(ctx,{
    type:'line',
    data:{labels,datasets:[{
      data:weights, borderColor:'#60C3FF', backgroundColor:'rgba(96,195,255,0.08)',
      pointBackgroundColor:weights.map(w=>w?'#60C3FF':'transparent'),
      pointRadius:5, tension:0.3, spanGaps:true, fill:true,
    }]},
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{
        y:{min:valid.length?Math.min(...valid)-1:60, max:valid.length?Math.max(...valid)+1:70, ticks:{font:{size:11},color:'#666'}, grid:{color:'rgba(255,255,255,0.05)'}},
        x:{ticks:{font:{size:11},color:'#666'}, grid:{display:false}}
      }
    }
  });
}

function renderWeightDiff() {
  const d=getDay(currentDate);
  const prev=new Date(currentDate); prev.setDate(prev.getDate()-1);
  const all=loadAll(); const pd=all[dateKey(prev)];
  const el=document.getElementById('weight-diff');
  if(!el) return;
  if(d.weight&&pd?.weight){
    const diff=parseFloat(d.weight)-parseFloat(pd.weight);
    el.textContent=(diff>0?'+':'')+diff.toFixed(1)+' kg';
    el.style.color=diff<=0?'var(--green)':'var(--red)';
  } else el.textContent='';
}

function saveWeight() {
  const d=getDay(currentDate);
  d.weight=document.getElementById('weight')?.value||'';
  setDay(currentDate,d); renderWeightDiff(); renderWeightChart();
}

function saveNote() {
  const d=getDay(currentDate);
  d.note=document.getElementById('ex-note')?.value||'';
  setDay(currentDate,d);
}

// ─── Settings ────────────────────────────────────────────
function openSettings() {
  document.getElementById('api-key-input').value=getApiKey();
  document.getElementById('settings-panel').classList.add('open');
}
function closeSettings() { document.getElementById('settings-panel').classList.remove('open'); }
function closeSettingsOutside(e) { if(e.target.id==='settings-panel') closeSettings(); }
function saveApiKey() {
  const val=document.getElementById('api-key-input').value.trim();
  if(val) { localStorage.setItem('anthropic_key',val); showToast('✅ API Key 已儲存'); closeSettings(); }
  else { showToast('請輸入 API Key'); }
}

// ─── Toast ───────────────────────────────────────────────
function showToast(msg) {
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

// ─── Navigation ──────────────────────────────────────────
function changeDate(delta) { currentDate.setDate(currentDate.getDate()+delta); render(); }
function switchTab(tab) {
  ['food','exercise','summary'].forEach(t=>{
    document.getElementById('panel-'+t).style.display=t===tab?'':'none';
    document.getElementById('tab-'+t).classList.toggle('active',t===tab);
  });
  if(tab==='exercise'){
    renderExGroup(DOGWALKS,'dogwalk-list');
    renderExGroup(WORKOUTS,'workout-list');
    const n=document.getElementById('ex-note');
    if(n) n.value=getDay(currentDate).note||'';
  }
  if(tab==='summary') updateSummary();
}

// ─── Init ─────────────────────────────────────────────────
function render() {
  const days=['日','一','二','三','四','五','六'];
  const today=new Date(); today.setHours(0,0,0,0);
  const diff=(currentDate-today)/864e5;
  document.getElementById('dateLabel').textContent=diff===0?'今天':diff===-1?'昨天':diff===1?'明天':`${currentDate.getMonth()+1}月${currentDate.getDate()}日`;
  document.getElementById('dateSubLabel').textContent=`${currentDate.getFullYear()}/${currentDate.getMonth()+1}/${currentDate.getDate()}（${days[currentDate.getDay()]}）`;
  const d=getDay(currentDate);
  const wEl=document.getElementById('weight');
  if(wEl) wEl.value=d.weight||'';
  renderMeals(); renderWater(); renderWeightDiff(); updateSummary();
}

// ─── Food Search ──────────────────────────────────────────
let foodSearchTimer = null;
let selectedFood = null;

function searchFood(query) {
  clearTimeout(foodSearchTimer);
  const resultsEl = document.getElementById('food-search-results');
  const detailEl = document.getElementById('food-detail');
  if (!query.trim() || query.length < 1) {
    resultsEl.innerHTML = '';
    detailEl.style.display = 'none';
    return;
  }
  foodSearchTimer = setTimeout(() => {
    if (typeof FOOD_DB === 'undefined') {
      resultsEl.innerHTML = '<div style="font-size:12px;color:var(--text3);padding:8px">載入食物資料庫中...</div>';
      loadFoodDB(() => searchFood(query));
      return;
    }
    const q = query.toLowerCase().trim();
    const results = FOOD_DB.filter(f =>
      f.n.toLowerCase().includes(q) ||
      (f.a && f.a.toLowerCase().includes(q))
    ).slice(0, 12);

    if (!results.length) {
      resultsEl.innerHTML = '<div style="font-size:12px;color:var(--text3);padding:8px">找不到相關食物</div>';
      return;
    }
    resultsEl.innerHTML = results.map((f, i) => `
      <div onclick="showFoodDetail(${i}, '${query}')" style="padding:9px 10px;border-bottom:1px solid var(--border);cursor:pointer;border-radius:6px;margin-bottom:2px;"
        onmouseover="this.style.background='var(--card2)'" onmouseout="this.style.background='transparent'">
        <div style="font-size:14px;font-weight:600;">${f.n}</div>
        <div style="font-size:11px;color:var(--text3);margin-top:2px;">${f.c}${f.a ? ' · ' + f.a : ''}</div>
        <div style="font-size:12px;color:var(--accent);margin-top:2px;">
          ${f.k ? f.k + ' kcal' : '—'} ／ 蛋白質 ${f.p || '—'}g ／ 碳水 ${f.ch || '—'}g
        </div>
      </div>
    `).join('');
    // Store filtered results for detail view
    window._searchResults = results;
    detailEl.style.display = 'none';
  }, 300);
}

function showFoodDetail(idx, query) {
  const f = window._searchResults[idx];
  if (!f) return;
  selectedFood = f;
  const detailEl = document.getElementById('food-detail');
  const resultsEl = document.getElementById('food-search-results');
  resultsEl.innerHTML = '';

  detailEl.style.display = 'block';
  detailEl.innerHTML = `
    <div style="background:var(--card2);border-radius:10px;padding:14px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;">
        <div>
          <div style="font-size:16px;font-weight:800;">${f.n}</div>
          <div style="font-size:11px;color:var(--text3);margin-top:2px;">${f.c}${f.a ? ' · ' + f.a : ''}</div>
        </div>
        <button onclick="clearFoodSearch()" style="background:transparent;border:none;color:var(--text3);font-size:18px;cursor:pointer;">✕</button>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px;">
        ${[
          ['熱量', f.k, 'kcal', 'var(--accent)'],
          ['蛋白質', f.p, 'g', 'var(--green)'],
          ['脂肪', f.f, 'g', 'var(--orange)'],
          ['碳水', f.ch, 'g', 'var(--blue)'],
          ['膳食纖維', f.fi, 'g', 'var(--text2)'],
        ].map(([label, val, unit, color]) => `
          <div style="background:var(--card);border-radius:8px;padding:8px;text-align:center;border:1px solid var(--border);">
            <div style="font-size:16px;font-weight:700;color:${color}">${val != null ? val : '—'}${val != null ? unit : ''}</div>
            <div style="font-size:10px;color:var(--text3);margin-top:2px;">${label}</div>
          </div>
        `).join('')}
        <div style="background:var(--card);border-radius:8px;padding:8px;text-align:center;border:1px solid var(--border);">
          <div style="font-size:11px;color:var(--text3);">以上為每</div>
          <div style="font-size:14px;font-weight:700;color:var(--text);">100g</div>
          <div style="font-size:11px;color:var(--text3);">的含量</div>
        </div>
      </div>

      <div style="margin-bottom:12px;">
        <div style="font-size:12px;color:var(--text3);margin-bottom:6px;">自訂食用量計算</div>
        <div style="display:flex;align-items:center;gap:8px;">
          <input type="number" id="custom-amount" value="100" min="1" max="2000"
            style="width:80px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:7px;font-size:14px;color:var(--text);text-align:right;font-family:inherit;"
            oninput="updateCustomCalc()">
          <span style="font-size:13px;color:var(--text2)">g</span>
          <div id="custom-calc" style="flex:1;font-size:13px;color:var(--text2);"></div>
        </div>
      </div>

      <button onclick="addFoodToMeal()" style="width:100%;padding:10px;background:var(--accent);color:#000;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;">
        ＋ 加入今日飲食記錄
      </button>
    </div>
  `;
  updateCustomCalc();
}

function updateCustomCalc() {
  const f = selectedFood;
  if (!f) return;
  const amt = parseFloat(document.getElementById('custom-amount')?.value) || 100;
  const ratio = amt / 100;
  const k = f.k ? (f.k * ratio).toFixed(1) : '—';
  const p = f.p ? (f.p * ratio).toFixed(1) : '—';
  const ch = f.ch ? (f.ch * ratio).toFixed(1) : '—';
  const fat = f.f ? (f.f * ratio).toFixed(1) : '—';
  document.getElementById('custom-calc').innerHTML =
    `<span style="color:var(--accent);font-weight:700">${k} kcal</span>｜蛋白 <span style="color:var(--green)">${p}g</span>｜碳水 ${ch}g｜脂肪 ${fat}g`;
}

function addFoodToMeal() {
  const f = selectedFood;
  if (!f) return;
  const amt = parseFloat(document.getElementById('custom-amount')?.value) || 100;
  // Find current active meal tab or default to lunch
  const mealOrder = ['breakfast','lunch','snack','dinner','supper'];
  let targetMeal = 'lunch';
  const h = new Date().getHours();
  if (h < 10) targetMeal = 'breakfast';
  else if (h < 14) targetMeal = 'lunch';
  else if (h < 17) targetMeal = 'snack';
  else if (h < 21) targetMeal = 'dinner';
  else targetMeal = 'supper';

  const mealEl = document.getElementById('mt-' + targetMeal);
  if (mealEl) {
    const existing = mealEl.value.trim();
    const newText = `${f.n} ${amt}g`;
    mealEl.value = existing ? existing + '、' + newText : newText;
    onMealInput(targetMeal);
    showToast(`✅ 已加入${['早','午','點','晚','宵'][mealOrder.indexOf(targetMeal)]}餐`);
    clearFoodSearch();
    // Scroll to meals
    document.getElementById('meals-list').scrollIntoView({behavior:'smooth'});
  }
}

function clearFoodSearch() {
  document.getElementById('food-search-input').value = '';
  document.getElementById('food-search-results').innerHTML = '';
  document.getElementById('food-detail').style.display = 'none';
  selectedFood = null;
}

function loadFoodDB(callback) {
  const script = document.createElement('script');
  script.src = 'fooddb.js';
  script.onload = callback;
  document.head.appendChild(script);
}

// Preload food DB
setTimeout(() => loadFoodDB(() => {}), 1000);

async function testApi() {
  const key = document.getElementById('api-key-input').value.trim() || getApiKey();
  const el = document.getElementById('api-test-result');
  if (!key) { el.innerHTML='<span style="color:var(--red)">請先輸入 API Key</span>'; return; }
  el.innerHTML='<span style="color:var(--text3)">測試中...</span>';
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'x-api-key':key, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' },
      body: JSON.stringify({ model:'claude-haiku-4-5-20251001', max_tokens:10, messages:[{role:'user',content:'hi'}] })
    });
    const data = await res.json();
    if(data.content) { el.innerHTML='<span style="color:var(--green)">✅ 連線成功！</span>'; }
    else { el.innerHTML=`<span style="color:var(--red)">❌ ${data?.error?.message||'連線失敗'}</span>`; }
  } catch(e) { el.innerHTML=`<span style="color:var(--red)">❌ ${e.message}</span>`; }
}

render();
</script>
</body>
</html>
